services:
  - type: web
    name: vitiu-store
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm --prefix client ci && npm --prefix server ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        generateValue: true
